<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rental Property Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-900 rounded-xl flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-building text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
      <p class="text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div id="sessionExpired" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-700 px-4 py-3 rounded-lg mb-4 text-sm">
        Your session has expired. Please login again.
      </div>

      <form id="loginForm" class="space-y-5">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <button type="submit" class="btn btn-primary w-full justify-center text-base py-3">
          <i class="fas fa-sign-in-alt mr-2"></i>Sign In
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">
          Don't have an account? <a href="/register.html" class="text-blue-600 hover:text-blue-800 font-medium">Create one</a>
        </p>
      </div>
    </div>

    <p class="text-center mt-6">
      <a href="/index.html" class="text-gray-500 text-sm hover:text-gray-700">
        <i class="fas fa-arrow-left mr-1"></i>Back to Home
      </a>
    </p>
  </div>

<script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check for session expired — clear stale tokens so user can re-login
      const params = new URLSearchParams(window.location.search);
      if (params.get('session') === 'expired') {
        document.getElementById('sessionExpired').classList.remove('hidden');
        localStorage.removeItem('token');
        localStorage.removeItem('refreshToken');
        localStorage.removeItem('user');
      }

      const form = document.getElementById('loginForm');

      // Real-time validation
      addRealTimeValidation(document.getElementById('email'), [ValidationRules.required, ValidationRules.email]);
      addRealTimeValidation(document.getElementById('password'), [ValidationRules.required]);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';

        const result = await login(formData.get('email'), formData.get('password'));

        if (result.success) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => redirectAfterLogin(result.user.role), 500);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Sign In';
          showToast(result.message || 'Login failed. Please try again.', 'error');
        }
      });
    });

</script>
</body>
</html>
