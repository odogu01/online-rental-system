<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leases - Admin - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-shield-alt text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-purple-300">Admin Portal</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section">Main</div><a href="/admin/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/admin/users.html"><i class="fas fa-users-cog"></i>Users</a><a href="/admin/properties.html"><i class="fas fa-building"></i>Properties</a><a href="/admin/leases.html" class="active"><i class="fas fa-file-signature"></i>Leases</a><a href="/admin/disputes.html"><i class="fas fa-gavel"></i>Disputes</a><a href="/admin/reports.html"><i class="fas fa-chart-bar"></i>Reports</a><div class="sidebar-section">Account</div><a href="/admin/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a></nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">All Leases</h2><p class="text-sm text-gray-500">System-wide lease oversight</p></div>
    </header>
    <div class="content-area">
      <div class="filter-bar">
        <select id="statusFilter" class="input" onchange="loadAllLeases()"><option value="">All Status</option><option value="active">Active</option><option value="expired">Expired</option><option value="terminated">Terminated</option></select>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <div id="leasesContainer"><p class="text-gray-400 text-center py-8"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</p></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('admin'); loadAllLeases(); });

    async function loadAllLeases() {
      const container = document.getElementById('leasesContainer');
      try {
        const params = {};
        const s = document.getElementById('statusFilter').value; if(s) params.status = s;
        const result = await apiGet('/leases', params);
        const leases = result.data?.leases || [];
        if (leases.length === 0) { container.innerHTML = '<p class="text-center text-gray-400 py-8">No leases found</p>'; return; }
        container.innerHTML = `<div class="overflow-x-auto"><table class="table"><thead><tr><th>Property</th><th>Tenant</th><th>Landlord</th><th>Period</th><th>Rent</th><th>Status</th></tr></thead><tbody>${leases.map(l => `<tr>
          <td class="font-medium">${l.propertyId?.title || 'N/A'}</td>
          <td>${l.tenantId?.fullName || 'N/A'}</td>
          <td class="text-sm">${l.propertyId?.landlordId?.fullName || 'N/A'}</td>
          <td class="text-sm">${formatDate(l.startDate)} - ${formatDate(l.endDate)}</td>
          <td>NGN ${(l.monthlyRent || 0).toLocaleString()}</td>
          <td>${getStatusBadge(l.status)}</td>
        </tr>`).join('')}</tbody></table></div>`;
      } catch(e) { container.innerHTML = '<p class="text-red-500 text-center py-8">Failed to load leases</p>'; }
    }
  </script>
</body>
</html>
