<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties - Rental Property Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="bg-white shadow-sm border-b border-gray-200 fixed w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-900 rounded-lg flex items-center justify-center">
            <i class="fas fa-building text-white text-lg"></i>
          </div>
          <span class="font-bold text-xl text-blue-900">RentalSystem</span>
        </div>
        <div class="hidden md:flex items-center gap-8">
          <a href="/index.html" class="text-gray-600 hover:text-blue-900">Home</a>
          <a href="/properties.html" class="text-blue-900 font-medium">Properties</a>
          <a href="/login.html" class="text-gray-600 hover:text-blue-900">Login</a>
          <a href="/register.html" class="btn btn-primary btn-sm">Get Started</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="pt-20 pb-12 bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Available Properties</h1>
        <p class="text-gray-500 mt-1">Browse through our listed properties</p>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="form-label">Status</label>
            <select id="filterStatus" class="form-input">
              <option value="">All Status</option>
              <option value="vacant">Vacant</option>
              <option value="occupied">Occupied</option>
              <option value="maintenance">Maintenance</option>
            </select>
          </div>
          <div>
            <label class="form-label">Min Rent (NGN)</label>
            <input type="number" id="filterMinRent" class="form-input" placeholder="0">
          </div>
          <div>
            <label class="form-label">Max Rent (NGN)</label>
            <input type="number" id="filterMaxRent" class="form-input" placeholder="500000">
          </div>
          <div>
            <label class="form-label">Bedrooms</label>
            <select id="filterBedrooms" class="form-input">
              <option value="">Any</option>
              <option value="0">Studio</option>
              <option value="1">1 Bedroom</option>
              <option value="2">2 Bedrooms</option>
              <option value="3">3 Bedrooms</option>
              <option value="4">4+ Bedrooms</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3 mt-4">
          <button onclick="applyFilters()" class="btn btn-primary btn-sm"><i class="fas fa-search mr-1"></i>Search</button>
          <button onclick="resetFilters()" class="btn btn-secondary btn-sm"><i class="fas fa-undo mr-1"></i>Reset</button>
        </div>
      </div>

      <!-- Results -->
      <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-12">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
          <p class="text-gray-500 mt-2">Loading properties...</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-blue-900 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm text-blue-300">
      &copy; 2024 David Frank Uko. Obong University.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    async function loadProperties() {
      const grid = document.getElementById('propertiesGrid');
      loadingState(grid);

      try {
        const result = await apiGet('/properties', {
          status: document.getElementById('filterStatus').value,
          minRent: document.getElementById('filterMinRent').value,
          maxRent: document.getElementById('filterMaxRent').value,
          bedrooms: document.getElementById('filterBedrooms').value
        });

        const properties = result.data?.properties || [];

        if (properties.length === 0) {
          emptyState(grid, 'No properties match your criteria', 'fa-search');
          return;
        }

        grid.innerHTML = properties.map(p => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition-shadow">
            <div class="h-44 bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
              <i class="fas fa-building text-5xl text-white opacity-60"></i>
            </div>
            <div class="p-5">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-semibold text-gray-900 text-lg">${p.title}</h3>
                ${getStatusBadge(p.status)}
              </div>
              <p class="text-sm text-gray-500 mb-2"><i class="fas fa-map-marker-alt mr-1 text-blue-500"></i>${p.location || 'N/A'}</p>
              <div class="flex gap-4 text-sm text-gray-500 mb-3">
                <span><i class="fas fa-bed mr-1"></i>${p.bedrooms} bed</span>
                <span><i class="fas fa-bath mr-1"></i>${p.bathrooms} bath</span>
              </div>
              <p class="text-xl font-bold text-blue-600">NGN ${(p.rentAmount || 0).toLocaleString()}<span class="text-sm font-normal text-gray-400">/month</span></p>
              ${p.amenities ? `<p class="text-xs text-gray-400 mt-2"><i class="fas fa-tag mr-1"></i>${truncate(p.amenities, 50)}</p>` : ''}
            </div>
          </div>
        `).join('');
      } catch (error) {
        emptyState(grid, 'Error loading properties', 'fa-exclamation-circle');
      }
    }

    function applyFilters() {
      loadProperties();
    }

    function resetFilters() {
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterMinRent').value = '';
      document.getElementById('filterMaxRent').value = '';
      document.getElementById('filterBedrooms').value = '';
      loadProperties();
    }

    document.addEventListener('DOMContentLoaded', loadProperties);

    function showToast(message, type) {
      const container = document.querySelector('.toast-container') || (() => {
        const c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); return c;
      })();
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
      toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${message}</span><button class="toast-close">&times;</button>`;
      toast.querySelector('.toast-close').onclick = () => toast.remove();
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'slideOut 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 4000);
    }
  </script>
</body>
</html>
