<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Maintenance Request - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Tenant Portal</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section">Main</div><a href="/tenant/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/tenant/properties.html"><i class="fas fa-building"></i>Browse Properties</a><a href="/tenant/my-property.html"><i class="fas fa-home"></i>My Property</a><div class="sidebar-section">Financial</div><a href="/tenant/payments.html"><i class="fas fa-credit-card"></i>Payments</a><div class="sidebar-section">Services</div><a href="/tenant/maintenance.html" class="active"><i class="fas fa-tools"></i>Maintenance</a><div class="sidebar-section">Account</div><a href="/tenant/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a></nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">New Maintenance Request</h2><p class="text-sm text-gray-500">Report a repair or maintenance issue</p></div>
    </header>
    <div class="content-area">
      <div class="bg-white rounded-xl shadow-sm p-6 max-w-3xl">
        <form id="maintForm" onsubmit="return handleSubmit(event)">
          <div class="mb-4"><label class="label">Subject</label><input type="text" id="subject" class="input" required placeholder="Brief title of the issue"></div>
          <div class="grid md:grid-cols-2 gap-4 mb-4">
            <div><label class="label">Property</label><select id="propertyId" class="input" required><option value="">Loading your properties...</option></select></div>
            <div><label class="label">Urgency</label><select id="urgency" class="input" required><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
          </div>
          <div class="mb-4"><label class="label">Description</label><textarea id="description" class="input" rows="4" required placeholder="Describe the issue in detail..."></textarea></div>
          <div id="formMessage" class="hidden mb-4"></div>
          <div class="flex gap-3"><button type="submit" id="submitBtn" class="btn btn-primary">Submit Request</button><a href="/tenant/maintenance.html" class="btn btn-secondary">Cancel</a></div>
        </form>
      </div>
    </div>
  </div>

<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script><script src="/js/ui.js"></script><script src="/js/maintenance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('tenant'); loadMyProperty(); });

    async function loadMyProperty() {
      const form = document.getElementById('maintForm');
      const select = document.getElementById('propertyId');
      try {
        const result = await apiGet('/leases/active');
        const leases = result.data?.leases || [];
        const myLease = leases[0];
        if (!myLease) {
          showFormError('formMessage', 'You can only request maintenance for your active rental property.');
          form.querySelectorAll('input, select, textarea, button').forEach(el => el.disabled = true);
          return;
        }
        const prop = myLease.propertyId || {};
        const propId = prop._id || myLease.propertyId;
        const propTitle = prop.title || propId || 'Your Property';
        select.innerHTML = `<option value="${escapeHtml(propId)}">${escapeHtml(propTitle)}</option>`;
      } catch(e) {
        showFormError('formMessage', 'Failed to load your property. Please try again.');
        form.querySelectorAll('input, select, textarea, button').forEach(el => el.disabled = true);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Submitting...';
      try {
        await submitMaintenanceRequest(e);
      } catch(err) {
        showFormError('formMessage', err);
        btn.disabled = false;
        btn.innerHTML = 'Submit Request';
      }
    }
  </script>
</body>
</html>
