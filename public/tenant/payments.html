<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payments - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Tenant Portal</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section">Main</div><a href="/tenant/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/tenant/properties.html"><i class="fas fa-building"></i>Browse Properties</a><a href="/tenant/my-property.html"><i class="fas fa-home"></i>My Property</a><div class="sidebar-section">Financial</div><a href="/tenant/payments.html" class="active"><i class="fas fa-credit-card"></i>Payments</a><div class="sidebar-section">Services</div><a href="/tenant/maintenance.html"><i class="fas fa-tools"></i>Maintenance</a><div class="sidebar-section">Account</div><a href="/tenant/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a></nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">My Payments</h2><p class="text-sm text-gray-500">View your payment history</p></div>
    </header>
    <div class="content-area">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="stat-card"><p class="text-sm text-gray-500">Total Paid</p><p class="text-2xl font-bold text-green-600">NGN <span id="totalPaid">0</span></p></div>
        <div class="stat-card"><p class="text-sm text-gray-500">Outstanding</p><p class="text-2xl font-bold text-yellow-600">NGN <span id="outstanding">0</span></p></div>
        <div class="stat-card"><p class="text-sm text-gray-500">Overdue</p><p class="text-2xl font-bold text-red-600">NGN <span id="overdue">0</span></p></div>
      </div>

      <div class="filter-bar">
        <div class="flex flex-wrap gap-3 items-center">
          <select id="filterStatus" class="input w-36">
            <option value="">All Statuses</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="overdue">Overdue</option>
          </select>
          <select id="filterMethod" class="input w-44">
            <option value="">All Methods</option>
            <option value="cash">Cash</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="online">Online</option>
            <option value="pos">POS</option>
            <option value="cheque">Cheque</option>
          </select>
          <button onclick="loadMyPayments()" class="btn btn-primary btn-sm"><i class="fas fa-search mr-1"></i>Filter</button>
        </div>
      </div>

      <div class="data-table-wrapper bg-white rounded-xl shadow-sm">
        <div class="overflow-x-auto">
          <table class="table">
            <thead>
              <tr><th>Property</th><th>Amount</th><th>Method</th><th>Date</th><th>Due</th><th>Status</th><th>Receipt</th></tr>
            </thead>
            <tbody id="paymentsContainer"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script><script src="/js/ui.js"></script><script src="/js/payment.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('tenant'); loadMyPayments(); });

    async function loadMyPayments() {
      try {
        const result = await apiGet('/payments');
        const summary = result.data?.summary || {};
        document.getElementById('totalPaid').textContent = (summary.paid || 0).toLocaleString();
        document.getElementById('overdue').textContent = (summary.overdue || 0).toLocaleString();

        try {
          const balResult = await apiGet('/payments/outstanding');
          document.getElementById('outstanding').textContent = ((balResult.data?.totalOutstanding) || 0).toLocaleString();
        } catch(e) {}

        const filters = {};
        const status = document.getElementById('filterStatus').value; if (status) filters.status = status;
        const method = document.getElementById('filterMethod').value; if (method) filters.method = method;
        await loadPayments('paymentsContainer', filters);
      } catch(e) { document.getElementById('paymentsContainer').innerHTML = '<tr><td colspan="7" class="text-red-500 p-4 text-center">Failed to load payments</td></tr>'; }
    }
  </script>
</body>
</html>
