<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Tenant Portal</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section">Main</div><a href="/tenant/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/tenant/properties.html"><i class="fas fa-building"></i>Browse Properties</a><a href="/tenant/my-property.html"><i class="fas fa-home"></i>My Property</a><div class="sidebar-section">Financial</div><a href="/tenant/payments.html"><i class="fas fa-credit-card"></i>Payments</a><div class="sidebar-section">Services</div><a href="/tenant/maintenance.html" class="active"><i class="fas fa-tools"></i>Maintenance</a><div class="sidebar-section">Account</div><a href="/tenant/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a></nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">Maintenance Requests</h2><p class="text-sm text-gray-500">Track your repair requests</p></div>
      <a href="/tenant/maintenance-create.html" class="btn btn-primary btn-sm"><i class="fas fa-plus mr-1"></i>New Request</a>
    </header>
    <div class="content-area">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card"><p class="text-sm text-gray-500">Total</p><p class="text-2xl font-bold" id="myTotal">0</p></div>
        <div class="stat-card"><p class="text-sm text-gray-500">Pending</p><p class="text-2xl font-bold text-yellow-600" id="myPending">0</p></div>
        <div class="stat-card"><p class="text-sm text-gray-500">In Progress</p><p class="text-2xl font-bold text-blue-600" id="myInProgress">0</p></div>
        <div class="stat-card"><p class="text-sm text-gray-500">Completed</p><p class="text-2xl font-bold text-green-600" id="myCompleted">0</p></div>
      </div>

      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <div id="requestsContainer"><p class="text-gray-400 text-center py-8"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</p></div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal"><div class="modal-content p-6" style="max-width:550px">
    <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-semibold">Request Details</h3><button onclick="closeModal('detailModal')" class="text-gray-400 hover:text-gray-700">&times;</button></div>
    <div id="detailContent"><p class="text-gray-400">Loading...</p></div>
  </div></div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script><script src="/js/maintenance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('tenant'); loadMyRequests(); });

    async function loadMyRequests() {
      try {
        await loadMaintenanceRequests('requestsContainer');
        const result = await apiGet('/maintenance');
        const requests = result.data?.requests || [];
        document.getElementById('myTotal').textContent = requests.length;
        document.getElementById('myPending').textContent = requests.filter(r => r.status === 'pending').length;
        document.getElementById('myInProgress').textContent = requests.filter(r => r.status === 'in-progress').length;
        document.getElementById('myCompleted').textContent = requests.filter(r => r.status === 'completed').length;
      } catch(e) { document.getElementById('requestsContainer').innerHTML = '<p class="text-red-500 p-4">Failed to load</p>'; }
    }

    window.viewDetails = async function(id) {
      openModal('detailModal');
      document.getElementById('detailContent').innerHTML = '<p class="text-gray-400">Loading...</p>';
      try { await viewRequestDetails(id, 'detailContent'); } catch(e) { document.getElementById('detailContent').innerHTML = '<p class="text-red-500">Failed to load</p>'; }
    };
  </script>
</body>
</html>
