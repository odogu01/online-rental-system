<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Properties - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Tenant Portal</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section">Main</div><a href="/tenant/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/tenant/properties.html" class="active"><i class="fas fa-building"></i>Browse Properties</a><a href="/tenant/my-property.html"><i class="fas fa-home"></i>My Property</a><div class="sidebar-section">Financial</div><a href="/tenant/payments.html"><i class="fas fa-credit-card"></i>Payments</a><div class="sidebar-section">Services</div><a href="/tenant/maintenance.html"><i class="fas fa-tools"></i>Maintenance</a><div class="sidebar-section">Account</div><a href="/tenant/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a></nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">Browse Properties</h2><p class="text-sm text-gray-500">Find available rental properties</p></div>
    </header>
    <div class="content-area">
      <div class="filter-bar">
        <div class="flex flex-wrap gap-3">
          <input type="number" id="minRent" placeholder="Min Rent" class="input w-28">
          <input type="number" id="maxRent" placeholder="Max Rent" class="input w-28">
          <input type="number" id="bedrooms" placeholder="Bedrooms" class="input w-24">
          <input type="text" id="location" placeholder="Location" class="input w-40">
          <button onclick="loadProperties()" class="btn btn-primary btn-sm"><i class="fas fa-search mr-1"></i>Search</button>
        </div>
      </div>
      <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"><p class="text-gray-400 col-span-full text-center py-8">Loading properties...</p></div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script><script src="/js/ui.js"></script><script src="/js/property.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('tenant'); loadProperties(); });

    async function loadProperties() {
      const filters = {};
      const min = document.getElementById('minRent').value; if (min) filters.minRent = min;
      const max = document.getElementById('maxRent').value; if (max) filters.maxRent = max;
      const bed = document.getElementById('bedrooms').value; if (bed) filters.bedrooms = bed;
      const loc = document.getElementById('location').value; if (loc) filters.location = loc;
      await loadPublicPropertiesGrid('propertiesGrid', filters);
    }
  </script>
</body>
</html>
