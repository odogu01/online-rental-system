<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Rental Property Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-12">
  <div class="w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-900 rounded-xl flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-building text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
      <p class="text-gray-500 mt-1">Join our rental management platform</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <form id="registerForm" class="space-y-4">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" class="form-input" placeholder="John Doe" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="phoneNumber">Phone Number (optional)</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" class="form-input" placeholder="+234 801 234 5678">
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">I want to register as</label>
          <select id="role" name="role" class="form-input">
            <option value="tenant">Tenant - Find & Rent Properties</option>
            <option value="landlord">Landlord - List & Manage Properties</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
          <p class="text-gray-400 text-xs mt-1">Must contain uppercase, lowercase, and a number</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Re-enter password" required>
          <p class="error-message hidden text-red-500 text-xs mt-1"></p>
        </div>

        <button type="submit" class="btn btn-primary w-full justify-center text-base py-3">
          <i class="fas fa-user-plus mr-2"></i>Create Account
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">
          Already have an account? <a href="/login.html" class="text-blue-600 hover:text-blue-800 font-medium">Sign in</a>
        </p>
      </div>
    </div>

    <p class="text-center mt-6">
      <a href="/index.html" class="text-gray-500 text-sm hover:text-gray-700">
        <i class="fas fa-arrow-left mr-1"></i>Back to Home
      </a>
    </p>
  </div>

<script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (isAuthenticated()) {
        const user = getUser();
        if (user) redirectAfterLogin(user.role);
      }

      const form = document.getElementById('registerForm');

      addRealTimeValidation(document.getElementById('fullName'), [ValidationRules.required, ValidationRules.minLength(2)]);
      addRealTimeValidation(document.getElementById('email'), [ValidationRules.required, ValidationRules.email]);
      addRealTimeValidation(document.getElementById('password'), [ValidationRules.required, ValidationRules.password]);
      addRealTimeValidation(document.getElementById('confirmPassword'), [
        ValidationRules.required,
        (v) => ValidationRules.matchField(document.getElementById('password').value, 'password')(v)
      ]);
      addRealTimeValidation(document.getElementById('phoneNumber'), [ValidationRules.phone]);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Password match check
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (password !== confirm) {
          showToast('Passwords do not match', 'error');
          return;
        }

        const formData = new FormData(form);
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Account...';

        const userData = {
          fullName: formData.get('fullName'),
          email: formData.get('email'),
          password: formData.get('password'),
          role: formData.get('role'),
          phoneNumber: formData.get('phoneNumber') || undefined
        };

        const result = await register(userData);

        if (result.success) {
          showToast('Account created successfully!', 'success');
          setTimeout(() => redirectAfterLogin(result.user.role), 1000);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Create Account';
          showToast(result.message || 'Registration failed', 'error');
        }
      });
    });

</script>
</body>
</html>
