<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leases - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Landlord Portal</div></div></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Main</div><a href="/landlord/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/landlord/properties.html"><i class="fas fa-building"></i>My Properties</a><a href="/landlord/leases.html" class="active"><i class="fas fa-file-signature"></i>Leases</a><a href="/landlord/tenants.html"><i class="fas fa-users"></i>Tenants</a>
      <div class="sidebar-section">Financial</div><a href="/landlord/payments.html"><i class="fas fa-credit-card"></i>Payments</a><a href="/landlord/reports.html"><i class="fas fa-chart-bar"></i>Reports</a>
      <div class="sidebar-section">Services</div><a href="/landlord/maintenance.html"><i class="fas fa-tools"></i>Maintenance</a>
      <div class="sidebar-section">Account</div><a href="/landlord/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a>
    </nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">Leases</h2><p class="text-sm text-gray-500">Manage lease agreements</p></div>
      <a href="/landlord/lease-create.html" class="btn btn-primary btn-sm"><i class="fas fa-plus mr-1"></i>Create Lease</a>
    </header>
    <div class="content-area">
      <div class="filter-bar">
        <div class="flex flex-wrap gap-3 items-center">
          <select id="statusFilter" class="input" onchange="loadLeases()"><option value="">All Status</option><option value="active">Active</option><option value="expired">Expired</option><option value="terminated">Terminated</option></select>
          <input type="text" id="searchFilter" placeholder="Search tenant or property..." class="input w-48" onkeyup="loadLeases()">
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table class="table"><thead><tr><th>Property</th><th>Tenant</th><th>Period</th><th>Monthly Rent</th><th>Status</th><th>Actions</th></tr></thead><tbody id="leasesTableBody"></tbody></table>
        <div id="loadingSpinner" class="text-center py-8"><i class="fas fa-spinner fa-spin text-2xl text-blue-600"></i><p class="text-gray-400 mt-2">Loading leases...</p></div>
      </div>
    </div>
  </div>

  <!-- Lease Detail Modal -->
  <div id="leaseModal" class="modal"><div class="modal-content p-6" style="max-width:600px">
    <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-semibold">Lease Details</h3><button onclick="closeModal('leaseModal')" class="text-gray-400 hover:text-gray-700">&times;</button></div>
    <div id="leaseDetailContent"><p class="text-gray-400">Loading...</p></div>
  </div></div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { protectPage('landlord'); loadLeases(); });

    async function loadLeases() {
      const tbody = document.getElementById('leasesTableBody');
      document.getElementById('loadingSpinner').classList.remove('hidden');
      try {
        const params = {};
        const s = document.getElementById('statusFilter').value; if(s) params.status = s;
        const q = document.getElementById('searchFilter').value; if(q) params.search = q;
        const result = await apiGet('/leases', params);
        const leases = result.data?.leases || [];
        document.getElementById('loadingSpinner').classList.add('hidden');
        if (leases.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400 py-8">No leases found</td></tr>'; return; }
        tbody.innerHTML = leases.map(l => `<tr>
          <td class="font-medium">${l.propertyId?.title || 'N/A'}</td>
          <td>${l.tenantId?.fullName || 'N/A'}</td>
          <td class="text-sm">${formatDate(l.startDate)} - ${formatDate(l.endDate)}</td>
          <td>NGN ${(l.monthlyRent || 0).toLocaleString()}</td>
          <td>${getStatusBadge(l.status)}</td>
          <td><button onclick="viewLease('${l._id}')" class="text-blue-600 hover:underline text-sm mr-2"><i class="fas fa-eye"></i></button></td>
        </tr>`).join('');
      } catch(e) { document.getElementById('loadingSpinner').classList.add('hidden'); tbody.innerHTML = '<tr><td colspan="6" class="text-center text-red-500 py-8">Failed to load leases</td></tr>'; }
    }

    async function viewLease(id) {
      openModal('leaseModal');
      document.getElementById('leaseDetailContent').innerHTML = '<p class="text-gray-400">Loading...</p>';
      try {
        const result = await apiGet(`/leases/${id}`);
        const l = result.data;
        document.getElementById('leaseDetailContent').innerHTML = `
          <div class="grid grid-cols-2 gap-4 text-sm"><div><p class="text-gray-500">Property</p><p class="font-medium">${l.propertyId?.title || 'N/A'}</p></div>
          <div><p class="text-gray-500">Tenant</p><p class="font-medium">${l.tenantId?.fullName || 'N/A'}</p></div>
          <div><p class="text-gray-500">Start Date</p><p>${formatDate(l.startDate)}</p></div><div><p class="text-gray-500">End Date</p><p>${formatDate(l.endDate)}</p></div>
          <div><p class="text-gray-500">Monthly Rent</p><p class="font-semibold">NGN ${(l.monthlyRent || 0).toLocaleString()}</p></div>
          <div><p class="text-gray-500">Security Deposit</p><p>NGN ${(l.securityDeposit || 0).toLocaleString()}</p></div>
          <div><p class="text-gray-500">Status</p>${getStatusBadge(l.status)}</div></div>
          <div class="mt-4 pt-4 border-t"><h4 class="font-medium text-sm mb-2">Payment History</h4>
          ${(l.payments || []).length === 0 ? '<p class="text-gray-400 text-sm">No payments yet</p>' :
          '<div class="space-y-2 max-h-40 overflow-y-auto">' + l.payments.map(p => `<div class="flex justify-between items-center text-sm py-1 border-b border-gray-50"><span>${formatDate(p.paymentDate)}</span><span class="font-medium">NGN ${(p.amount || 0).toLocaleString()}</span>${getStatusBadge(p.status)}</div>`).join('') + '</div>'}</div>
          <div class="mt-4 flex gap-2">${l.status === 'active' ? `<button onclick="terminateLease('${l._id}')" class="btn btn-danger btn-sm">Terminate Lease</button>` : ''}</div>`;
      } catch(e) { document.getElementById('leaseDetailContent').innerHTML = '<p class="text-red-500">Failed to load details</p>'; }
    }

    async function terminateLease(id) {
      if (!confirm('Terminate this lease? This will mark the property as vacant.')) return;
      try { await apiPut(`/leases/${id}/status`, { status: 'terminated' }); showToast('Lease terminated', 'success'); closeModal('leaseModal'); loadLeases(); }
      catch(e) { showToast(e.message || 'Failed', 'error'); }
    }
  </script>
</body>
</html>
