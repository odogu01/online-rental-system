<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Payment - Rental System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-logo flex items-center gap-3"><i class="fas fa-building text-2xl"></i><div><div class="font-bold">RentalSystem</div><div class="text-xs text-blue-300">Landlord Portal</div></div></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Main</div><a href="/landlord/dashboard.html"><i class="fas fa-chart-pie"></i>Dashboard</a><a href="/landlord/properties.html"><i class="fas fa-building"></i>My Properties</a><a href="/landlord/leases.html"><i class="fas fa-file-signature"></i>Leases</a><a href="/landlord/tenants.html"><i class="fas fa-users"></i>Tenants</a>
      <div class="sidebar-section">Financial</div><a href="/landlord/payments.html" class="active"><i class="fas fa-credit-card"></i>Payments</a><a href="/landlord/reports.html"><i class="fas fa-chart-bar"></i>Reports</a>
      <div class="sidebar-section">Services</div><a href="/landlord/maintenance.html"><i class="fas fa-tools"></i>Maintenance</a>
      <div class="sidebar-section">Account</div><a href="/landlord/profile.html"><i class="fas fa-user-cog"></i>Profile</a><a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i>Logout</a>
    </nav>
  </div>
  <div class="main-content">
    <header class="main-header">
      <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div><h2 class="text-lg font-semibold">Record Payment</h2><p class="text-sm text-gray-500">Log a rent payment from a tenant</p></div>
    </header>
    <div class="content-area">
      <div class="bg-white rounded-xl shadow-sm p-6 max-w-3xl">
        <form id="paymentForm" onsubmit="return handleRecord(event)">
          <div class="grid md:grid-cols-2 gap-4 mb-4">
            <div><label class="label">Active Lease</label><select id="leaseId" class="input" required><option value="">Loading...</option></select></div>
            <div><label class="label">Amount (NGN)</label><input type="number" id="amount" class="input" min="0" step="0.01" required></div>
            <div><label class="label">Payment Date</label><input type="date" id="paymentDate" class="input" required></div>
            <div><label class="label">Due Date</label><input type="date" id="dueDate" class="input" required></div>
            <div><label class="label">Payment Method</label><select id="paymentMethod" class="input" required><option value="">Select Method</option><option value="cash">Cash</option><option value="bank_transfer">Bank Transfer</option><option value="cheque">Cheque</option><option value="pos">POS</option></select></div>
            <div><label class="label">Status</label><select id="status" class="input" required><option value="paid">Paid</option><option value="pending">Pending</option></select></div>
          </div>
          <div id="formMessage" class="hidden mb-4"></div>
          <div class="flex gap-3"><button type="submit" id="submitBtn" class="btn btn-primary">Record Payment</button><a href="/landlord/payments.html" class="btn btn-secondary">Cancel</a></div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/dashboard.js"></script><script src="/js/payment.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      protectPage('landlord');
      document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
      loadActiveLeases();
    });

    async function loadActiveLeases() {
      try {
        const result = await apiGet('/leases/active');
        const leases = result.data?.leases || [];
        const select = document.getElementById('leaseId');
        select.innerHTML = '<option value="">Select Lease</option>' + leases.map(l =>
          `<option value="${l._id}">${l.propertyId?.title || 'Property'} - ${l.tenantId?.fullName || 'Tenant'} (NGN ${(l.monthlyRent || 0).toLocaleString()})</option>`
        ).join('');
        // Auto-fill amount
        select.onchange = function() {
          const selected = leases.find(l => l._id === this.value);
          if (selected) document.getElementById('amount').value = selected.monthlyRent || '';
        };
      } catch(e) { showToast('Failed to load leases', 'error'); }
    }

    async function handleRecord(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Recording...';
      try {
        const data = { leaseId: document.getElementById('leaseId').value, amount: Number(document.getElementById('amount').value), paymentDate: document.getElementById('paymentDate').value, dueDate: document.getElementById('dueDate').value, paymentMethod: document.getElementById('paymentMethod').value, status: document.getElementById('status').value };
        await apiPost('/payments', data);
        showToast('Payment recorded successfully!', 'success');
        setTimeout(() => window.location.href = '/landlord/payments.html', 1500);
      } catch(e) { showFormError('formMessage', e); btn.disabled = false; btn.innerHTML = 'Record Payment'; }
    }
  </script>
</body>
</html>
